<style>

  $$('.sel').forEach(e=>e.classList.remove('sel'));sel=el;if(!el)return;

async function pushImgs(c,id){
  const cache=new Map();
  c.querySelectorAll('img[src^="data:"]').forEach(i=>cache.set(i.getAttribute('src'),null));
  c.querySelectorAll('[style*="data:"]').forEach(e=>{const m=DU.exec(e.getAttribute('style'));if(m)cache.set(m[1],null)});
  const urls=[...cache.keys()];let n=0;
  for(const u of urls){
    setS(`ছবি আপলোড ${++n}/${urls.length}`);
    const ext=(/data:image\/(\w+)/.exec(u)||[])[1]||'jpg';
    const r=fb.S.ref(fb.st,`designs/${id}/${Date.now().toString(36)}_${n}.${ext}`);
    await fb.S.uploadString(r,u,'data_url');
    cache.set(u,await fb.S.getDownloadURL(r));
  }
  const rep=root=>{
    root.querySelectorAll('img[src^="data:"]').forEach(i=>i.setAttribute('src',cache.get(i.getAttribute('src'))));
    root.querySelectorAll('[style*="data:"]').forEach(e=>e.setAttribute('style',e.getAttribute('style').replace(/data:[^"')]+/,m=>cache.get(m)||m)));
  };
  rep(c);rep(book);
}

const put=async o=>{const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})};

const rad=r=>typeof r=='number'?r+'px':r;
const ink=c=>/^#[0-9a-f]{6}$/i.test(c)?((parseInt(c.slice(1,3),16)*299+parseInt(c.slice(3,5),16)*587+parseInt(c.slice(5,7),16)*114)/1000>150?'#111':'#fff'):'#111';
const bdOf=s=>s.card.bd=='transparent'?s.c2:s.card.bd;
let curS=null;

/* ===== স্টাইল প্রয়োগ (পুরো বুকলেটে) ===== */
function applyStyle(s,withText){
  curS=s;const set=(k,v)=>R.style.setProperty(k,v);
  set('--c1',s.c1);set('--c2',s.c2);set('--pbg',s.bg);set('--pat',s.pat||'none');set('--ps',s.ps||'auto');
  set('--clip',s.clip);set('--clipf',s.clipf);
  const f=s.fr||NOFR;set('--fi',f[0]);set('--fb',f[1]);set('--fr',f[2]);
  set('--band',s.band);set('--bt',s.bt);set('--cx',s.cx||s.tx);set('--secbg',s.card.bg);set('--nmc',s.nm||s.c1);
  set('--bbf',s.bbf||'none');set('--bb2',s.bb2||s.band);
  $$('.page').forEach(p=>{
    [...p.classList].filter(c=>c.startsWith('st-')).forEach(c=>p.classList.remove(c));
    p.classList.add('sx','st-'+s.k);p.style.backgroundColor='';
  });
  $$('.grid').forEach(g=>{
    const c=s.card,st=g.style;
    st.setProperty('--cbg',c.bg);st.setProperty('--cbd',c.bd);st.setProperty('--crad',rad(c.r));
    st.setProperty('--csh',c.sh);st.setProperty('--cbw',c.bw+'px');st.setProperty('--cbs',c.s||'solid');st.setProperty('--cbf',c.f||'none');
  });
  if(withText)styleText(s);
  chk();
}
function styleText(s){
  const cx=s.cx||s.tx;
  $$('.tb:not(.im)').forEach(t=>{
    const s0=t.dataset.s0||(t.dataset.s0=parseFloat(t.style.fontSize)||18);
    const pg=t.closest('.page'),y=t.offsetTop,big=+s0>=30,bgv=t.style.background||'';
    t.dataset.en=big?s.hf:(s.bf||'Poppins');t.dataset.bn=big?s.hb:(s.bb||'Hind Siliguri');ff(t);
    t.style.fontSize=Math.round(s0*(big?(s.hs||1):1))+'px';
    if(big){t.dataset.h=1;t.style.fontWeight=s.hw;t.style.letterSpacing=s.ls||'0';t.style.textTransform=s.tt||'none';if(s.al&&pg.id=='p1')t.style.textAlign=s.al}
    else{delete t.dataset.h;t.style.letterSpacing='';t.style.textTransform=''}
    if(/var\(--c1\)/.test(bgv)){t.style.color=ink(s.c1)}
    else if(bgv&&bgv!='transparent'){
      t.style.background=s.card.bg;t.style.border=(s.card.bw||2)+'px '+(s.card.s||'solid')+' '+bdOf(s);
      t.style.borderRadius=rad(s.card.r);t.style.boxShadow=s.card.sh=='none'?'':s.card.sh;t.style.color=cx;
      t.style.backdropFilter=s.card.f||'';
    }else t.style.color=(pg.id=='p1'&&(y<340||y>=985))?s.bt:s.tx;
  });
}

    C({x:112,y:390,w:570,s:18,a:'center',h:`<div style="${hfont};font-size:2.1em;font-weight:800;color:var(--c1)">ভর্তি চলছে</div><div style="font-size:1.3em;font-weight:700;color:var(--c2)">শিক্ষাবর্ষ ২০২৬–২০২৭</div><div style="margin-top:10px">প্লে থেকে ৫ম শ্রেণি পর্যন্ত</div>`});
    pill(222,640,350,'Admissions Open 2026','var(--c1)',ink(s.c1));
    C({x:112,y:730,w:570,s:16,a:'center',h:feat});
    B({x:77,y:1004,w:640,s:15,a:'center',c:s.bt,h:foot});

/* ===== প্রিভিউ থাম্বনেইল ===== */
function thumb(s){
  const d=document.createElement('div');d.className='sth';
  d.style.backgroundColor=s.bg;d.style.backgroundImage=s.pat||'none';
  d.style.backgroundSize=(s.ps||'auto').replace(/(\d+)px/g,(m,v)=>Math.max(2,v/6)+'px');
  d.innerHTML='<i class="tb1"></i><i class="tb2"></i><b class="tt">Aa আ</b><em class="tc"></em>';
  const [h,f,t,c]=d.children;
  h.style.background=s.band;h.style.clipPath=s.clip;
  f.style.background=s.band;f.style.clipPath=s.clipf;
  t.style.cssText=`color:${s.bt};font-family:'${s.hf}','${s.hb}';font-weight:${s.hw};text-transform:${s.tt||'none'}`;
  c.style.background=s.card.bg;
  c.style.border=(s.card.bw?Math.min(2,s.card.bw):0)+'px solid '+s.card.bd;
  c.style.borderRadius=typeof s.card.r=='number'?Math.round(s.card.r/3)+'px':s.card.r.replace(/\d+px/g,m=>Math.round(parseInt(m)/4)+'px');
  c.style.boxShadow=s.card.sh=='none'?'none':s.card.sh.replace(/-?\d+px/g,m=>Math.round(parseInt(m)/3)+'px');
  return d;
}

/* ===== প্যানেল ===== */
const rail=$('#rail'),pn=$('#pn');
const btn=document.createElement('button');btn.dataset.t='style';btn.innerHTML='<i>🎭</i>স্টাইল';
rail.insertBefore(btn,rail.children[1]);
const tp=document.createElement('div');tp.className='tp';tp.id='tp_style';pn.append(tp);
tp.innerHTML=`<h4>🎭 ৩০টি ডিজাইন স্টাইল — Design Styles</h4>
<div class="sfl" id="sfl"><button data-f="" class="on">সব / All</button><button data-f="c">কভার</button><button data-f="l">তালিকা পেজ</button><button data-f="f">ফরম</button></div>
<div class="scur" id="scur">একটি স্টাইল বেছে নিন — রং, ফন্ট, ব্যাকগ্রাউন্ড, বর্ডার, ছায়া ও কার্ড সব বদলে যাবে।</div>
<div class="stp" id="stp"><div style="font-size:12px;font-weight:600">কভারে টেমপ্লেট বসান (সম্পাদনাযোগ্য):</div>
<div class="tbs"><button data-n="1">১ সেন্টার</button><button data-n="2">২ বাম-সারি</button><button data-n="3">৩ পোস্টার</button></div>
<label><input type="checkbox" id="stx" checked> বিদ্যমান লেখার ফন্ট ও রং-ও বদলান</label></div>
<div class="sg" id="sg"></div>`;
let flt='';
function render(){
  const g=$('#sg');g.innerHTML='';
  S.filter(s=>!flt||s.u.includes(flt)).forEach(s=>{
    const [bd,ed]=s.d.split('|'),c=document.createElement('div');c.className='scard'+(curS&&curS.k==s.k?' on':'');c.dataset.k=s.k;
    c.append(thumb(s));
    c.insertAdjacentHTML('beforeend',`<div class="sn"><b>${s.en}</b><span>${s.bn}</span></div><p>${bd}<br><i>${ed}</i></p><button>নির্বাচন করুন / Select</button>`);
    g.append(c);
  });
}
function pickStyle(s){
  applyStyle(s,$('#stx').checked);
  $('#scur').innerHTML=`<b>নির্বাচিত:</b> ${s.en} — ${s.bn}`;$('#stp').classList.add('on');
  render();toast(s.bn+' স্টাইল প্রয়োগ হয়েছে ✓');
}
$('#sg').onclick=e=>{const c=e.target.closest('.scard');if(!c)return;if(e.target.closest('button')||e.target.closest('.sth'))pickStyle(S.find(s=>s.k==c.dataset.k))};
$('#stp').onclick=e=>{const b=e.target.closest('button[data-n]');if(b&&curS){tpl(curS,+b.dataset.n);toast('কভার টেমপ্লেট বসেছে — লেখা ক্লিক করে বদলান ✓')}};
$('#sfl').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.f;$$('#sfl button').forEach(x=>x.classList.toggle('on',x==b));render()};
render();
/* সেভ করা ডিজাইন খুললে চলতি স্টাইল চিনে নেওয়া */
const detect=()=>{const p=$('#p1');const c=p&&[...p.classList].find(x=>x.startsWith('st-'));curS=c?S.find(s=>'st-'+s.k==c)||null:null;if(curS){$('#scur').innerHTML=`<b>চলতি স্টাইল:</b> ${curS.en} — ${curS.bn}`;$('#stp').classList.add('on')}render()};
detect();$('#rail').addEventListener('click',e=>{if(e.target.closest('[data-t="style"]'))detect()});

/* ===== PNG / JPG এক্সপোর্ট ===== */
async function exp(type){
  try{
    if(!window.html2canvas)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});
  }catch(e){return toast('PNG/JPG এক্সপোর্টের লাইব্রেরি লোড হয়নি (ইন্টারনেট দরকার)')}
  select(null);const z=book.style.zoom;book.style.zoom=1;document.body.classList.add('cap');
  try{
    for(const p of $$('.page')){
      toast(p.id+' তৈরি হচ্ছে…');
      const c=await html2canvas(p,{scale:3,backgroundColor:null,useCORS:true,logging:false});
      const a=document.createElement('a');a.download=`${$('#dname').value||'design'}-${p.id}.${type}`;
      a.href=c.toDataURL(type=='png'?'image/png':'image/jpeg',.95);a.click();
      await new Promise(r=>setTimeout(r,350));
    }
    toast('এক্সপোর্ট শেষ ✓');
  }catch(e){console.warn(e);toast('এক্সপোর্ট ব্যর্থ — নিখুঁত ফল পেতে PDF প্রিন্ট ব্যবহার করুন')}
  finally{book.style.zoom=z;document.body.classList.remove('cap')}
}
const ddm=$('.ddm');
[['ep','🖼 সব পেজ PNG (হাই-রেজ)','png'],['ej2','🖼 সব পেজ JPG (হাই-রেজ)','jpeg']].forEach(([id,t,ty])=>{
  const b=document.createElement('button');b.id=id;b.textContent=t;b.onclick=()=>exp(ty);ddm.insertBefore(b,$('#ej'));
});
})();
